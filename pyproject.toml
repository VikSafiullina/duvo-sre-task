[project]
name = "duvo-sre-task"
version = "0.1.0"
description = "Production-shaped service scaffold for the Duvo SRE task"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31",
    "arq>=0.28",
    "prometheus-client>=0.26",
    "httpx>=0.28",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-asyncpg>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation>=0.65b0",
    "docker>=7.1",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.16"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    # third-party noise (starlette test client internals), not our code
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "S311"]  # asserts in tests; `random` is used for chaos, not crypto

[tool.ruff.lint.isort]
known-third-party = ["docker"]  # the repo's ./docker dir (postgres init) is not the SDK

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env must be set before app modules import settings

[tool.pyright]
venvPath = "."
venv = ".venv"
