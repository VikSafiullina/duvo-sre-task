# SLO: 99.5% of API requests (excluding probes/metrics) succeed (non-5xx) over 30 days.
# Error budget = 0.5%. Multi-window, multi-burn-rate alerts per the Google SRE workbook.
groups:
  - name: duvo-api-slo
    rules:
      - record: slo:api_errors:ratio_rate5m
        expr: |
          (sum(rate(http_requests_total{job="duvo-api",route!~"/healthz|/readyz|/metrics",status=~"5.."}[5m])) or vector(0))
          / sum(rate(http_requests_total{job="duvo-api",route!~"/healthz|/readyz|/metrics"}[5m]))
      - record: slo:api_errors:ratio_rate30m
        expr: |
          (sum(rate(http_requests_total{job="duvo-api",route!~"/healthz|/readyz|/metrics",status=~"5.."}[30m])) or vector(0))
          / sum(rate(http_requests_total{job="duvo-api",route!~"/healthz|/readyz|/metrics"}[30m]))
      - record: slo:api_errors:ratio_rate1h
        expr: |
          (sum(rate(http_requests_total{job="duvo-api",route!~"/healthz|/readyz|/metrics",status=~"5.."}[1h])) or vector(0))
          / sum(rate(http_requests_total{job="duvo-api",route!~"/healthz|/readyz|/metrics"}[1h]))
      - record: slo:api_errors:ratio_rate6h
        expr: |
          (sum(rate(http_requests_total{job="duvo-api",route!~"/healthz|/readyz|/metrics",status=~"5.."}[6h])) or vector(0))
          / sum(rate(http_requests_total{job="duvo-api",route!~"/healthz|/readyz|/metrics"}[6h]))

      - alert: ApiErrorBudgetFastBurn
        expr: slo:api_errors:ratio_rate1h > (14.4 * 0.005) and slo:api_errors:ratio_rate5m > (14.4 * 0.005)
        labels:
          severity: page
        annotations:
          summary: API burning its error budget 14x too fast (budget gone in ~2 days)
          description: "5xx ratio over 1h is {{ $value | humanizePercentage }}."
          runbook: docs/RUNBOOK.md#apierrorbudgetfastburn

      - alert: ApiErrorBudgetSlowBurn
        expr: slo:api_errors:ratio_rate6h > (6 * 0.005) and slo:api_errors:ratio_rate30m > (6 * 0.005)
        labels:
          severity: ticket
        annotations:
          summary: API burning its error budget 6x too fast (budget gone in ~5 days)
          description: "5xx ratio over 6h is {{ $value | humanizePercentage }}."
          runbook: docs/RUNBOOK.md#apierrorbudgetslowburn

      - alert: ApiLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="duvo-api",route!~"/healthz|/readyz|/metrics"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: API p95 latency above 500ms for 10 minutes
          description: "p95 is {{ $value | humanizeDuration }}."
          runbook: docs/RUNBOOK.md#apilatencyhigh

  - name: duvo-worker
    rules:
      - alert: JobFailureRateHigh
        expr: |
          sum(rate(jobs_total{outcome="failed"}[15m]))
          / sum(rate(jobs_total{outcome=~"success|failed"}[15m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: More than 5% of background jobs fail permanently
          description: "Permanent failure ratio is {{ $value | humanizePercentage }}."
          runbook: docs/RUNBOOK.md#jobfailureratehigh

      # Age, not depth: the admission cap bounds depth (~50), and a stuck queue with zero
      # throughput never shows up in a histogram. Oldest queued sandbox catches both.
      - alert: SandboxQueueStalled
        expr: max(sandbox_oldest_in_status_seconds{job="duvo-api",status="queued"}) > 60
        for: 1m
        labels:
          severity: page
        annotations:
          summary: A sandbox request has waited over a minute for a worker
          description: "Oldest queued sandbox has waited {{ $value | humanizeDuration }}."
          runbook: docs/RUNBOOK.md#sandboxqueuestalled

      # A/B: every job routed to a pool that is down or wedged is stranded; with a canary
      # weight > 0 that's a slice of users whose sandboxes never start. Depth alone can't
      # tell busy from dead; "has due jobs, finished none in 5m" can. Absent series (pool
      # never scraped) count as "finished none".
      - alert: QueueNotDraining
        expr: |
          (max by (deployment) (queue_depth{job="duvo-api"}) > 0)
          unless on (deployment) (sum by (deployment) (rate(jobs_total[5m])) > 0)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.deployment }} pool has queued jobs but finished none in 5m"
          description: "{{ $value }} due jobs waiting on the {{ $labels.deployment }} pool."
          runbook: docs/RUNBOOK.md#queuenotdraining

  - name: duvo-sandboxes
    rules:
      # Freshness SLI (docs/SLO.md): p95 time from request to a serving sandbox.
      - record: sandbox:time_to_running:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(sandbox_time_to_running_seconds_bucket[5m])))
      - record: sandbox:start_failure:ratio_rate5m
        expr: |
          (sum(rate(jobs_total{task="start_sandbox",outcome="failed"}[5m])) or vector(0))
          / sum(rate(jobs_total{task="start_sandbox",outcome=~"success|failed"}[5m]))
      - record: sandbox:capacity_used:ratio
        expr: max(sum by (instance) (sandboxes_active{job="duvo-api"})) / max(sandbox_capacity{job="duvo-api"})

      - alert: SandboxStartSlow
        expr: sandbox:time_to_running:p95_5m > 10
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: p95 time-to-running above the 10s SLO for 10 minutes
          description: "p95 request -> serving is {{ $value | humanizeDuration }}."
          runbook: docs/RUNBOOK.md#sandboxstartslow

      # Longest legit start is ~45s (Docker deadline 30s + readiness 15s); stopping is seconds.
      - alert: SandboxStuckInTransition
        expr: max by (status) (sandbox_oldest_in_status_seconds{job="duvo-api",status=~"starting|stopping"}) > 120
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "A sandbox has been {{ $labels.status }} for over 2 minutes"
          description: "Oldest {{ $labels.status }} sandbox: {{ $value | humanizeDuration }}."
          runbook: docs/RUNBOOK.md#sandboxstuckintransition

      - alert: SandboxCapacityHigh
        expr: sandbox:capacity_used:ratio > 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Over 80% of sandbox capacity in use for 10 minutes; 429s are next
          description: "{{ $value | humanizePercentage }} of SANDBOX_MAX_ACTIVE in use."
          runbook: docs/RUNBOOK.md#sandboxcapacityhigh

      - alert: SandboxLeaked
        expr: sum(increase(sandboxes_reaped_total{reason=~"orphan|vanished"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: Sandbox containers drifted out of sync with the database
          description: "{{ $value }} orphaned/vanished sandboxes reaped in 15m (crash or external kill)."
          runbook: docs/RUNBOOK.md#sandboxleaked

      # Paging: with the reaper down, TTLs aren't enforced and the host fills up. The cap then
      # answers 429, which the 5xx SLO alerts never see.
      - alert: SandboxReaperFailing
        expr: sum(increase(sandbox_reconcile_runs_total{outcome="failed"}[10m])) >= 3
        labels:
          severity: page
        annotations:
          summary: Sandbox reaper keeps failing; TTLs and leak cleanup are not enforced
          description: "{{ $value }} failed reaper sweeps in 10m."
          runbook: docs/RUNBOOK.md#sandboxreaperfailing

  - name: duvo-targets
    rules:
      - alert: TargetDown
        expr: up{job=~"duvo-.*"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} is not being scraped"
          description: "Prometheus cannot reach {{ $labels.instance }}."
          runbook: docs/RUNBOOK.md#targetdown
